<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Princess Counting Game</title>
<style>
body{
font-family:Arial;
background:linear-gradient(#ffe6f2,#fff7fb);
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.game{
background:white;
padding:20px;
border-radius:20px;
max-width:520px;
width:95%;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.castle{font-size:40px}
.question{font-size:22px;font-weight:bold;margin:10px 0}
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:15px}
.item{font-size:40px;background:#fff0f7;border-radius:12px;padding:10px;width:70px;height:70px;display:flex;align-items:center;justify-content:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:15px;font-size:20px;border:none;border-radius:15px;background:#ffb6d9;font-weight:bold}
.next-btn{background:#d7b3ff;margin-top:10px}
.status{margin:10px;font-weight:bold}

.psyduck-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.4);
display:none;
justify-content:center;
align-items:center;
}
.psyduck-overlay.show{display:flex}

.psyduck-card{
background:white;
padding:20px;
border-radius:20px;
text-align:center;
max-width:300px
}

.psyduck-img{
width:160px;
margin-bottom:10px;
}

.tier-2 img{filter:brightness(1.1)}
.tier-3 img{filter:brightness(1.15) saturate(1.1)}
.tier-4 img{filter:brightness(1.2) saturate(1.2)}
.tier-5 img{filter:brightness(1.25) saturate(1.25)}
.tier-6 img{filter:brightness(1.3) saturate(1.3)}
.tier-7 img{filter:brightness(1.35) saturate(1.35)}
.tier-8 img{filter:brightness(1.4) saturate(1.4)}
.tier-9 img{filter:brightness(1.45) saturate(1.45)}
.tier-10 img{filter:brightness(1.5) saturate(1.5)}

</style>
</head>
<body>

<div class="game">
<div class="castle">👑🏰✨</div>
<h2>Princess Counting Game</h2>

<div>Stars: <span id="score">0</span> ⭐</div>

<div class="question" id="question"></div>
<div class="items" id="items"></div>
<div class="answers" id="answers"></div>
<div class="status" id="status"></div>
<button class="next-btn" id="nextBtn" style="display:none">Next</button>

</div>

<div class="psyduck-overlay" id="psyduckOverlay">

<div class="psyduck-card" id="psyduckCard">

<h3 id="psyduckStage">Pretty Psyduck</h3>

<img src="psyduck.png" class="psyduck-img" id="psyduckImg">

<div id="psyduckText">Great job!</div>

<button onclick="hidePsyduck()">Keep Playing</button>

</div>

</div>

<script>

const itemChoices=[
{emoji:'👑',name:'crowns'},
{emoji:'💎',name:'gems'},
{emoji:'🪄',name:'magic wands'},
{emoji:'🌸',name:'flowers'},
{emoji:'🦄',name:'unicorns'}
]

let score=0
let round=1
let correctAnswer=0
let chosen

const scoreEl=document.getElementById('score')
const questionEl=document.getElementById('question')
const itemsEl=document.getElementById('items')
const answersEl=document.getElementById('answers')
const statusEl=document.getElementById('status')
const nextBtn=document.getElementById('nextBtn')

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5)
}

function makeRound(){

statusEl.textContent=''
nextBtn.style.display='none'
answersEl.innerHTML=''
itemsEl.innerHTML=''

chosen=itemChoices[Math.floor(Math.random()*itemChoices.length)]
correctAnswer=Math.floor(Math.random()*5)+1

questionEl.textContent=`How many ${chosen.name} do you see?`

for(let i=0;i<correctAnswer;i++){
let div=document.createElement('div')
div.className='item'
div.textContent=chosen.emoji
itemsEl.appendChild(div)
}

let options=new Set([correctAnswer])
while(options.size<4){
options.add(Math.floor(Math.random()*5)+1)
}

shuffle([...options]).forEach(num=>{
let btn=document.createElement('button')
btn.textContent=num
btn.onclick=()=>checkAnswer(num)
answersEl.appendChild(btn)
})
}

function getLevel(){
return Math.min(Math.floor(score/5),10)
}

function showPsyduck(){

let level=getLevel()

let card=document.getElementById('psyduckCard')
card.className=`psyduck-card tier-${level}`

let text=document.getElementById('psyduckText')

if(score>=50){
text.textContent="Max Pretty Psyduck! Keep playing!"
}else{
text.textContent=`${score} stars! Psyduck got prettier!`
}

document.getElementById('psyduckOverlay').classList.add('show')

}

function hidePsyduck(){
document.getElementById('psyduckOverlay').classList.remove('show')
}

function checkAnswer(num){

let buttons=answersEl.querySelectorAll('button')
buttons.forEach(b=>b.disabled=true)

if(num===correctAnswer){

score++
scoreEl.textContent=score
statusEl.textContent="Correct! 🎉"

if(score%5===0){
showPsyduck()
}

}else{
statusEl.textContent=`Answer is ${correctAnswer}`
}

round++
nextBtn.style.display='block'

}

nextBtn.onclick=makeRound

makeRound()

</script>

</body>
</html>
